<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dineway - Restaurant Solutions</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>
  <section class="hero">
    <div class="overlay"></div>
    <div class="content">
      <div class="logo">
        <div class="logo-icon">
          <svg width="48" height="40" viewBox="0 0 48 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- steam lines -->
            <line x1="18" y1="4" x2="18" y2="0" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="24" y1="5" x2="24" y2="0" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="30" y1="4" x2="30" y2="0" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
            <!-- cloche dome -->
            <path d="M4 22 Q4 10 24 10 Q44 10 44 22 Z" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
            <!-- base line -->
            <line x1="2" y1="22" x2="46" y2="22" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
            <!-- plate base -->
            <path d="M8 26 Q8 30 24 30 Q40 30 40 26" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="brand-name">DINEWAY</span>
          <span class="brand-sub">RESTAURANT SOLUTIONS</span>
        </div>
      </div>

      <div class="headline">
        <h1>
          <span class="line-gold">Indulge In Elegant</span>
          <span class="line-white">Dining Moments</span>
        </h1>
      </div>

      <div class="cta-buttons">
        <a href="#login" class="btn">Login</a>
        <a href="#join" class="btn">Join Us</a>
      </div>
    </div>
  </section>
</body>
</html>
